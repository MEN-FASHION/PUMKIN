<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南瓜图鉴 · 490张</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a0a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px}
.header{text-align:center;padding:18px 16px 12px;background:linear-gradient(180deg,#2a1010,#1a0a0a);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.header h1{font-size:1.4rem;color:#FF7518;letter-spacing:3px}
.header p{color:#886644;margin-top:4px;font-size:0.8rem}
.gallery{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px}
@media(max-width:1400px){.gallery{grid-template-columns:repeat(7,1fr)}}
@media(max-width:1100px){.gallery{grid-template-columns:repeat(5,1fr)}}
@media(max-width:800px){.gallery{grid-template-columns:repeat(4,1fr)}}
@media(max-width:550px){.gallery{grid-template-columns:repeat(3,1fr)}}
@media(max-width:380px){.gallery{grid-template-columns:repeat(2,1fr)}}
.item{border-radius:4px;overflow:hidden;cursor:pointer;aspect-ratio:1}
.item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.item:hover img{transform:scale(1.08)}
.bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:200;display:flex;gap:20px;align-items:center;background:rgba(26,10,10,.95);padding:12px 32px;border-radius:30px;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.6);border:1px solid rgba(255,117,24,.2)}
.stat-box{display:flex;align-items:center;gap:6px;color:#FF7518;font-size:1.3rem;padding:6px 10px}
.stat-box .num{font-weight:700;font-size:1.3rem;min-width:28px;text-align:center}
.stat-box .icon{font-size:1.4rem}
.like-box{cursor:pointer;transition:all .2s;border-radius:20px;padding:6px 10px}
.like-box:hover{background:rgba(255,117,24,.15)}
.like-box.liked{color:#FF8C28}
.like-box.liked .icon{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.nav-buttons{position:fixed;right:16px;bottom:90px;display:flex;flex-direction:column;gap:10px;z-index:300}
.nav-btn{width:50px;height:50px;border-radius:50%;background:#FF7518;color:#1a0a0a;border:none;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.5);transition:all .2s;font-weight:bold}
.nav-btn:hover{transform:scale(1.12);background:#FF8C28}
.float-comment-btn{position:fixed;left:16px;bottom:24px;z-index:300;width:56px;height:56px;border-radius:50%;background:#FF7518;color:#1a0a0a;border:none;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(0,0,0,.5);transition:all .2s}
.float-comment-btn:hover{transform:scale(1.1);background:#FF8C28}
.float-comment-btn .badge{position:absolute;top:-6px;right:-6px;background:#e74c3c;color:#fff;font-size:0.7rem;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:bold;border:2px solid #1a0a0a}
.comment-panel{position:fixed;left:0;right:0;bottom:0;max-height:75vh;background:#2a1010;z-index:400;transform:translateY(100%);transition:transform .3s;border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.6)}
.comment-panel.open{transform:translateY(0)}
.cp-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #443322}
.cp-header h2{color:#FF7518;font-size:1.1rem}
.cp-close,.fb-close{color:#888;font-size:1.6rem;cursor:pointer;background:none;border:none;padding:4px 8px}
.cp-body{padding:16px 20px;overflow-y:auto;max-height:60vh}
.comment-input{display:flex;gap:10px;margin-bottom:16px}
.comment-input input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid #443322;background:#1a0a0a;color:#ddd;font-size:1rem}
.comment-input input:focus{outline:none;border-color:#FF7518}
.comment-input button{padding:12px 24px;border-radius:10px;background:#FF7518;color:#1a0a0a;border:none;cursor:pointer;font-weight:700;font-size:0.95rem;white-space:nowrap}
.comment-input button:hover{background:#FF8C28}
.comment-list{display:flex;flex-direction:column;gap:12px}
.comment-item{background:#1a0a0a;border-radius:10px;padding:12px 16px}
.comment-item .text{color:#ccc;font-size:0.95rem;line-height:1.5}
.comment-item .time{color:#666;font-size:0.75rem;margin-top:6px}
.feedback-panel{position:fixed;left:0;right:0;bottom:0;max-height:85vh;background:#2a1010;z-index:450;transform:translateY(100%);transition:transform .3s;border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.6)}
.feedback-panel.open{transform:translateY(0)}
.fb-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #443322}
.fb-header h2{color:#FF7518;font-size:1.1rem}
.fb-body{padding:20px;overflow-y:auto;max-height:70vh}
.fb-field{margin-bottom:16px}
.fb-field label{display:block;color:#FF7518;font-size:0.9rem;margin-bottom:6px;font-weight:600}
.fb-field input,.fb-field textarea{width:100%;padding:12px 16px;border-radius:10px;border:1px solid #443322;background:#1a0a0a;color:#ddd;font-size:0.95rem;font-family:sans-serif}
.fb-field input:focus,.fb-field textarea:focus{outline:none;border-color:#FF7518}
.fb-field textarea{min-height:100px;resize:vertical}
.fb-submit{width:100%;padding:14px;border-radius:12px;background:#FF7518;color:#1a0a0a;border:none;cursor:pointer;font-weight:700;font-size:1rem;margin-top:8px}
.fb-submit:hover{background:#FF8C28}
.fb-list{margin-top:20px}
.fb-list h3{color:#FF7518;font-size:0.9rem;margin-bottom:10px}
.fb-item{background:#1a0a0a;border-radius:10px;padding:12px 16px;margin-bottom:10px}
.fb-item .info{color:#888;font-size:0.75rem}
.fb-item .suggestion{color:#ccc;font-size:0.9rem;margin-top:6px;line-height:1.5}
.lightbox{display:none;position:fixed;z-index:999;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);align-items:center;justify-content:center}
.lightbox.on{display:flex}
.lightbox img{max-width:92%;max-height:88vh;border-radius:8px}
.lb-close{position:absolute;top:16px;right:24px;font-size:2.5rem;color:#FF7518;cursor:pointer}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:3rem;color:#FF7518;cursor:pointer;padding:12px;user-select:none}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-count{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#886644;font-size:0.9rem}
</style>
</head>

<div class="bottom-bar">
  <div class="stat-box"><span class="icon">👁</span><span class="num" id="viewCount">-</span></div>
  <div class="stat-box like-box" id="likeBox" onclick="toggleLike()"><span class="icon">👍</span><span class="num" id="likeCount">-</span></div>
</div>

<button class="float-comment-btn" onclick="toggleCommentPanel()">💬<span class="badge" id="commentBadge" style="display:none">0</span></button>

<div class="comment-panel" id="commentPanel">
  <div class="cp-header"><h2>💬 评论</h2><button class="cp-close" onclick="toggleCommentPanel()">✕</button></div>
  <div class="cp-body"><div class="comment-input"><input type="text" id="commentText" placeholder="说点什么..." maxlength="200" onkeydown="if(event.key==='Enter')postComment()"><button onclick="postComment()">发表</button></div><div class="comment-list" id="commentList"></div></div>
</div>

<div class="feedback-panel" id="feedbackPanel">
  <div class="fb-header"><h2>📝 反馈留言</h2><button class="fb-close" onclick="toggleFeedbackPanel()">✕</button></div>
  <div class="fb-body"><div class="fb-field"><label>手机号（选填）</label><input type="tel" id="fbPhone" placeholder="您的手机号" maxlength="20"></div><div class="fb-field"><label>微信号（选填）</label><input type="text" id="fbWechat" placeholder="您的微信号" maxlength="30"></div><div class="fb-field"><label>建议内容</label><textarea id="fbSuggestion" placeholder="写下您的建议..." maxlength="500"></textarea></div><button class="fb-submit" onclick="submitFeedback()">提交反馈</button><div class="fb-list" id="fbList"></div></div>
</div>

<div class="nav-buttons">
  <button class="nav-btn" onclick="scrollToSpot('top')" title="顶部">⬆</button>
  <button class="nav-btn" onclick="scrollToSpot('middle')" title="中部">●</button>
  <button class="nav-btn" onclick="scrollToSpot('bottom')" title="底部">⬇</button>
  <button class="nav-btn" onclick="toggleFeedbackPanel()" title="反馈" style="font-size:1rem">📝</button>
</div>

<div class="lightbox" id="lb"><span class="lb-close" id="lbClose">✕</span><span class="lb-prev" id="lbPrev">‹</span><img id="lbImg" src=""><span class="lb-next" id="lbNext">›</span><div class="lb-count" id="lbCount"></div></div>

<script>
const SB_URL='https://uxiynkqsxdtpkfkfzfzbx.supabase.co';
const SB_KEY='sb_publishable_CPzX48WEhH1aJs8Wd1cocw_IylGFZci';
async function sbGet(t,q){let r=await fetch(SB_URL+'/rest/v1/'+t+'?'+q,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});if(!r.ok)return null;return r.json();}
async function sbPost(t,d){let r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(d)});return r.ok;}
async function sbRpc(fn){let r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:'{}'});return r.ok;}
async function initViews(){try{await sbRpc('increment_view');let d=await sbGet('stats','select=value&key=eq.views');document.getElementById('viewCount').textContent=(d&&d.length)?d[0].value:0;}catch(e){document.getElementById('viewCount').textContent='—';}}
let liked=false;
async function initLikes(){
  liked=localStorage.getItem('pumpkin_liked')==='1';
  if(liked)document.getElementById('likeBox').classList.add('liked');
  try{let d=await sbGet('stats','select=value&key=eq.likes');document.getElementById('likeCount').textContent=(d&&d.length)?d[0].value:0;}catch(e){document.getElementById('likeCount').textContent='—';}
}
async function toggleLike(){
  let box=document.getElementById('likeBox');
  if(liked){
    await sbRpc('decrement_like');liked=false;localStorage.setItem('pumpkin_liked','0');box.classList.remove('liked');
  }else{
    await sbRpc('increment_like');liked=true;localStorage.setItem('pumpkin_liked','1');box.classList.add('liked');
  }
  let d=await sbGet('stats','select=value&key=eq.likes');
  document.getElementById('likeCount').textContent=(d&&d.length)?d[0].value:0;
}
async function loadComments(){
  try{
    let d=await sbGet('comments','select=content,created_at&order=created_at.desc&limit=50');
    let badge=document.getElementById('commentBadge');
    if(d&&d.length>0){badge.textContent=d.length;badge.style.display='flex';}else{badge.style.display='none';}
    let list=document.getElementById('commentList');
    if(!d||d.length===0){list.innerHTML='<div style="color:#666;font-size:0.9rem;text-align:center;padding:30px">还没有评论，快来抢沙发~</div>';return;}
    list.innerHTML=d.map(function(c){let t=new Date(c.created_at).toLocaleString('zh-CN');return '<div class="comment-item"><div class="text">'+escapeHtml(c.content)+'</div><div class="time">'+t+'</div></div>';}).join('');
  }catch(e){document.getElementById('commentList').innerHTML='<div style="color:#666;font-size:0.9rem;text-align:center;padding:30px">评论加载失败</div>';}
}
async function postComment(){let input=document.getElementById('commentText');let text=input.value.trim();if(!text)return;let ok=await sbPost('comments',{nickname:'匿名',content:text});if(ok){input.value='';loadComments();}else{alert('评论发表失败，请稍后重试');}}
function toggleCommentPanel(){document.getElementById('commentPanel').classList.toggle('open');document.getElementById('feedbackPanel').classList.remove('open');}
async function submitFeedback(){
  let phone=document.getElementById('fbPhone').value.trim();let wechat=document.getElementById('fbWechat').value.trim();let suggestion=document.getElementById('fbSuggestion').value.trim();
  if(!suggestion){alert('请填写建议内容');return;}
  let ok=await sbPost('feedback',{phone:phone,wechat:wechat,suggestion:suggestion});
  if(ok){document.getElementById('fbPhone').value='';document.getElementById('fbWechat').value='';document.getElementById('fbSuggestion').value='';alert('反馈已提交，感谢！');loadFeedback();}else{alert('反馈提交失败，请稍后重试');}
}
async function loadFeedback(){
  try{
    let d=await sbGet('feedback','select=phone,wechat,suggestion,created_at&order=created_at.desc&limit=20');
    let list=document.getElementById('fbList');if(!d||d.length===0){list.innerHTML='';return;}
    list.innerHTML='<h3>近期反馈</h3>'+d.map(function(f){let t=new Date(f.created_at).toLocaleString('zh-CN');let contact=[];if(f.phone)contact.push('📱'+f.phone);if(f.wechat)contact.push('💬'+f.wechat);let cs=contact.length?contact.join(' | '):'匿名';return '<div class="fb-item"><div class="info">'+cs+' · '+t+'</div><div class="suggestion">'+escapeHtml(f.suggestion)+'</div></div>';}).join('');
  }catch(e){}
}
function toggleFeedbackPanel(){document.getElementById('feedbackPanel').classList.toggle('open');document.getElementById('commentPanel').classList.remove('open');}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function scrollToSpot(spot){let h=document.body.scrollHeight;if(spot==='top')window.scrollTo({top:0,behavior:'smooth'});else if(spot==='middle')window.scrollTo({top:h*0.5,behavior:'smooth'});else if(spot==='bottom')window.scrollTo({top:h,behavior:'smooth'});}
var items=document.querySelectorAll('.item'),cur=0,total=items.length;
var lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCount=document.getElementById('lbCount');
items.forEach(function(el,i){el.onclick=function(){cur=i;lbImg.src=el.querySelector('img').src;lbCount.textContent=(cur+1)+' / '+total;lb.classList.add('on');};});
document.getElementById('lbClose').onclick=function(){lb.classList.remove('on')};
document.getElementById('lbPrev').onclick=function(){cur=(cur-1+total)%total;show()};
document.getElementById('lbNext').onclick=function(){cur=(cur+1)%total;show()};
function show(){lbImg.src=items[cur].querySelector('img').src;lbCount.textContent=(cur+1)+' / '+total;}
lb.onclick=function(e){if(e.target===lb)lb.classList.remove('on')};
document.onkeydown=function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft'){cur=(cur-1+total)%total;show()}if(e.key==='ArrowRight'){cur=(cur+1)%total;show()}};
initViews();initLikes();loadComments();loadFeedback();
</script>
</body>
</html>
