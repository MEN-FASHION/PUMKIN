*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a0a;font-family:sans-serif}
.header{text-align:center;padding:40px 20px 20px;background:linear-gradient(180deg,#2a1010,#1a0a0a)}
.header h1{font-size:2rem;color:#FF7518;letter-spacing:4px}
.header p{color:#886644;margin-top:8px;font-size:0.9rem}
.masonry{column-count:5;column-gap:8px;padding:12px}
@media(max-width:1200px){.masonry{column-count:4}}
@media(max-width:900px){.masonry{column-count:3}}

.item{break-inside:avoid;margin-bottom:8px;border-radius:6px;overflow:hidden;cursor:pointer;position:relative}
.item img{width:100%;display:block;transition:transform .3s,opacity .3s}
.item:hover img{transform:scale(1.04);opacity:.9}
.lightbox{display:none;position:fixed;z-index:999;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);align-items:center;justify-content:center}
.lightbox.on{display:flex}
.lightbox img{max-width:92%;max-height:88vh;border-radius:8px}
.lb-close{position:absolute;top:16px;right:24px;font-size:2.2rem;color:#FF7518;cursor:pointer}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:3rem;color:#FF7518;cursor:pointer;padding:12px;user-select:none}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-count{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#886644;font-size:0.85rem}
</style>

<div class="lightbox" id="lb">
  <span class="lb-close" id="lbClose">✕</span>
  <span class="lb-prev" id="lbPrev">‹</span>
  <img id="lbImg" src="">
  <span class="lb-next" id="lbNext">›</span>
  <div class="lb-count" id="lbCount"></div>
</div>
<script>
var items=document.querySelectorAll('.item'),cur=0,total=items.length;
var lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbCount=document.getElementById('lbCount');
items.forEach(function(el,i){el.onclick=function(){cur=i;show();lb.classList.add('on')}});
function show(){lbImg.src=items[cur].querySelector('img').src;lbCount.textContent=(cur+1)+' / '+total}
document.getElementById('lbClose').onclick=function(){lb.classList.remove('on')};
document.getElementById('lbPrev').onclick=function(){cur=(cur-1+total)%total;show()};
document.getElementById('lbNext').onclick=function(){cur=(cur+1)%total;show()};
lb.onclick=function(e){if(e.target===lb)lb.classList.remove('on')};
document.onkeydown=function(e){
  if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')lb.classList.remove('on');
  if(e.key==='ArrowLeft'){cur=(cur-1+total)%total;show()}
  if(e.key==='ArrowRight'){cur=(cur+1)%total;show()}
};
</script>
